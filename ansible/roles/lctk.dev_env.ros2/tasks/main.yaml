---
- name: Check if ROS 2 Humble is already installed
  ansible.builtin.stat:
    path: /opt/ros/humble
  register: ros2_installed

- name: Add ROS 2 apt repository
  become: true
  when: not ros2_installed.stat.exists
  block:
    - name: Add ROS 2 GPG key
      ansible.builtin.shell: |
        curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key | sudo apt-key add -
      args:
        creates: /usr/share/keyrings/ros-archive-keyring.gpg

    - name: Add ROS 2 repository
      ansible.builtin.apt_repository:
        repo: "deb http://packages.ros.org/ros2/ubuntu {{ ansible_distribution_release }} main"
        state: present

- name: Install ROS 2 Humble
  become: true
  ansible.builtin.apt:
    name:
      - ros-humble-desktop
      - ros-humble-ros-base
      - python3-rosdep
      - python3-colcon-common-extensions
      - python3-vcstool
    state: present
  when: not ros2_installed.stat.exists

- name: Install additional ROS 2 packages
  become: true
  ansible.builtin.apt:
    name:
      - ros-humble-gscam
      - ros-humble-velodyne
      - ros-humble-velodyne-driver
      - ros-humble-velodyne-pointcloud
      - ros-humble-vision-msgs
      - ros-humble-tf2-ros
      - ros-humble-tf2-tools
      - ros-humble-interactive-markers
      - ros-humble-image-transport
      - ros-humble-cv-bridge
      - ros-humble-image-geometry
    state: present

- name: Check if rosdep is initialized
  ansible.builtin.stat:
    path: /etc/ros/rosdep/sources.list.d/20-default.list
  register: rosdep_initialized

- name: Initialize rosdep (system-wide)
  become: true
  ansible.builtin.shell: |
    rosdep init
  when: not rosdep_initialized.stat.exists
  changed_when: true

- name: Update rosdep (user)
  ansible.builtin.shell: |
    rosdep update
  changed_when: false
  environment:
    ROSDEP_UPDATE_QUIET: "true"