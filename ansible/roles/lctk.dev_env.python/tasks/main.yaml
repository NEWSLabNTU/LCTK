---
- name: Install Python environment
  become: true
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-dev
      - python3-venv
      - python3-setuptools
      - python3-wheel
      - python3-empy  # Required by ROS 2, must be system package (3.3.4)
    state: present

- name: Remove pip-installed empy if present (conflicts with system package)
  ansible.builtin.pip:
    name: empy
    state: absent
    executable: /usr/bin/pip3
  failed_when: false  # Don't fail if not installed

- name: Install Python libraries for scientific computing
  become: true
  ansible.builtin.apt:
    name:
      - python3-numpy
      - python3-scipy
      - python3-matplotlib
      - python3-pandas
    state: present

- name: Install Python build dependencies
  ansible.builtin.pip:
    name:
      - cffi>=1.0.0
      - setuptools>=45
      - wheel
    extra_args: --user
    executable: /usr/bin/pip3
    state: present
