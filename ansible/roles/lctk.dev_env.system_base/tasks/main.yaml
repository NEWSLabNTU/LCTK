---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400

- name: Install basic system packages
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - cmake
      - pkg-config
      - git
      - curl
      - wget
      - software-properties-common
      - lsb-release
      - gnupg
      - ca-certificates
    state: present