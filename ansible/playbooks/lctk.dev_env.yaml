---
- name: Set up source development environment for LCTK
  hosts: localhost
  connection: local
  vars:
    lctk_root: "{{ playbook_dir | dirname | dirname }}"
  vars_prompt:
    - name: prompt_install_cuda
      prompt: |-
        [Warning] Some LCTK components may benefit from CUDA support for GPU acceleration.
        Install CUDA libraries? [y/N]
      private: false
      default: n
    - name: prompt_install_dev_tools
      prompt: |-
        [Warning] Do you want to install recommended development tools for LCTK? [y/N]
      private: false
      default: y
  pre_tasks:
    - name: Verify OS
      ansible.builtin.fail:
        msg: Only Ubuntu 22.04 is supported. Please use Ubuntu 22.04 LTS.
      when: ansible_distribution_version != '22.04'

    - name: Print system information
      ansible.builtin.debug:
        msg:
          - os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          - arch: "{{ ansible_architecture }}"
          - ros_distro: humble

  roles:
    # Core system dependencies
    - role: lctk.dev_env.system_base
    - role: lctk.dev_env.build_tools

    # ROS 2 installation
    - role: lctk.dev_env.ros2
      when: true

    # Rust toolchain
    - role: lctk.dev_env.rust

    # Python environment
    - role: lctk.dev_env.python

    # OpenCV and vision libraries
    - role: lctk.dev_env.opencv

    # GStreamer for video processing
    - role: lctk.dev_env.gstreamer

    # Geometric computation libraries
    - role: lctk.dev_env.geometric_libs

    # Network capture libraries
    - role: lctk.dev_env.network_libs

    # Optional CUDA support
    - role: lctk.dev_env.cuda
      when: prompt_install_cuda == 'y'

    # Development tools (optional)
    - role: lctk.dev_env.dev_tools
      when: prompt_install_dev_tools == 'y'

    # ROS dependencies via rosdep
    - role: lctk.dev_env.rosdep

    # Colcon extensions for Rust
    - role: lctk.dev_env.colcon_rust

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ====================================
          LCTK development environment setup completed!

          Next steps:
          1. Source ROS 2 environment: source /opt/ros/humble/setup.bash
          2. Build the project: make build
          3. Launch sample data: make launch_lidar_camera_sample_data
          ====================================