name: lab1
description: Lab 1 six-placement calibration

data:
  kind: live

devices:
  lidars:
    top:
      pointcloud_topic: /sensing/lidar/iv_points
  cameras:
    front:
      image_topic: /sensing/camera/zedxm/rgb/color/rect/image

markers:
  calibration_board:
    target_config: $(find-pkg-share lctk_launch)/config/targets/solid_600_aruco_1_v1.json5
    detector_config: $(find-pkg-share lctk_launch)/config/board/solid_600/robin.json5
    pairs:
      - [top, front]

sync:
  tolerance_ms: 50
  queue_size: 100
  drop_policy: reject_new

assisted:
  review_archive_path: $(session-dir)/out/detections.json
  stability_max_translation_m: 0.120
  stability_max_rotation_deg: 8.0
