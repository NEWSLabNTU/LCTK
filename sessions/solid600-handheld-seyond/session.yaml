name: solid600-handheld-seyond
description: >
  Solid 600 mm target held by hand, Seyond Falcon plus a ZED, walked around an
  underground car park. The same recordings as solid600-handheld-vlp, read
  through the Falcon instead of the VLP-32C: both sensors are in every
  newtype_* bag, so this is the same scene seen by a denser sensor.

  Why it exists: a VLP-32C crosses a 600 mm plate with about four rings, which
  keeps the LiDAR detection rate low and starves assisted mode of the still,
  novel placements it selects from. The Falcon samples the same plate far more
  densely, so more frames survive to the review page. The sync window stays
  tight because the board moves.

data:
  kind: bag
  # Gitignored field capture -- symlink one in; see README.md.
  path: $(session-dir)/bag
  # The ZED records CompressedImage and nothing in this tree subscribes to one
  # (aruco_locator_node takes sensor_msgs/Image), so the bridge belongs in the
  # launched graph rather than in a second terminal an operator can forget.
  republish:
    - from: /sensing/camera/zed/rgb/color/rect/image/compressed
      to: /sensing/camera/zed/rgb/color/rect/image

devices:
  lidars:
    seyond_lidar:
      frame_id: seyond
      pointcloud_topic: /iv_points
  cameras:
    front_center:
      frame_id: zed_left_camera_frame_optical
      image_topic: /sensing/camera/zed/rgb/color/rect/image

markers:
  calibration_board:
    target_config: $(find-pkg-share lctk_launch)/config/targets/solid_600_aruco_1_v1.json5
    detector_config: $(find-pkg-share lctk_launch)/config/board/solid_600/seyond.json5
    pairs:
      - [seyond_lidar, front_center]

sync: { tolerance_ms: 50, queue_size: 100, drop_policy: reject_new }

assisted:
  review_archive_path: $(session-dir)/out/detections.json

  # MEASURED ON THE FALCON, 2026-09-04, on newtype_1 and newtype_2.
  #
  # Method, and a correction worth keeping. The obvious approach -- record the
  # board detection topic and replay it through StillnessTracker offline --
  # measures the wrong stream: the gate runs on *synchronized pairs*, so a board
  # detection whose ArUco partner missed the 50 ms window never reaches it. That
  # offline sweep predicted 7 usable placements where the node produced 3. The
  # numbers below come from the node itself, via the stillness verdict now
  # logged at debug level in lidar_to_camera_solver.
  #
  # A second way it was nearly measured wrong: three bag replays leaked into one
  # recording, because a play_launch from an earlier launch was still alive and
  # `pkill` had not reached it. 940 s of poses across three passes looks like a
  # long, quiet recording. tmp/record_one_pass.sh now refuses to start if
  # anything is running and fails if the bag header time goes backwards.
  #
  # The Falcon's 1 s translation-span floor is 8.7 mm (newtype_1) and 13.0 mm
  # (newtype_2), against the VLP-32C's 13.5 mm: the denser sensor fits the
  # plate more steadily, so the *noise* these thresholds sit above is smaller
  # here than on the session this file was copied from.
  #
  # Distinct placements the node actually captured, end to end, at 8 deg:
  #
  #      50 mm  (inherited VLP value)  ->  3-4, which is what prompted this
  #     120 mm                         ->  6 (newtype_1), 9 (newtype_2)
  #
  # Six was the bar; 120 mm clears it on both recordings. On newtype_1 the gate
  # fired 8 times and the novelty gate folded 2 of those into placements it
  # already held, which is the gate doing its job rather than a loss.
  #
  # What loosening costs, stated plainly: the captured 1 s spans at this setting
  # run 12-102 mm over 3-9 pairs, so some are the gate catching a slow moment
  # mid-walk rather than a hold. That is the documented trade -- the gates are
  # not the quality filter, the review page is, and a marginal capture costs one
  # click while a missed hold costs walking the board back. The inherited 50 mm
  # already captured mid-walk; loosening makes it more frequent, not new.
  #
  # Not fixed by this, and visible in the same runs: every solve reports
  # DEGENERATE with a ~42 px reprojection RMS. More placements did not help,
  # so it is not a diversity problem -- see the note in README.md.
  stability_max_translation_m: 0.120
  # Left at 8.0 deliberately. 12 deg does not improve the worst case (7 either
  # way) and reduces the number of captures that are genuinely stationary,
  # because rotation is the noise-dominated axis: few returns land on a 600 mm
  # plate at 6 m, so the fitted orientation moves when the board does not.
  # Loosening the axis that is mostly noise buys captures without buying holds.
  stability_max_rotation_deg: 8.0
