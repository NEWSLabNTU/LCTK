# LCTK Sample Data Calibration Configuration
#
# This configuration matches the sensor setup used by:
#   just sample-data  (or ros2 launch lctk_sample_data lidar_camera.launch.xml)
#
# Usage:
#   # Terminal 1: Start sample data playback
#   just sample-data
#
#   # Terminal 2: Start calibration pipeline
#   ros2 launch lctk_launch calibrate.launch.py \
#       config_file:=$(ros2 pkg prefix lctk_launch)/share/lctk_launch/config/examples/sample_data.yaml
#
# This generates:
# - 1 lidar_board_detector node
# - 1 aruco_locator_node node
# - 1 lidar-camera solver node

devices:
  lidars:
    top_lidar:
      pointcloud_topic: /sensing/lidar/top/pointcloud_raw
      frame_id: velodyne_top

  cameras:
    front_center:
      image_topic: /sensing/camera/front_center/image_raw
      frame_id: camera_front_center

# Synchronizer window: how far apart in time a camera frame and a LiDAR
# sweep may be and still be treated as observing the calibration target at
# the same instant. Too wide and a moving board gets paired across frames
# where it has visibly moved; too narrow (or 0, meaning infinite) and
# streams at different rates drift apart with no time-based pairing at all.
# 100ms/100/reject_new matches the offline (rosbag/sample-data) default this
# config has always run under.
sync:
  tolerance_ms: 100
  queue_size: 100
  drop_policy: reject_new

markers:
  calibration_board:
    target_config: $(find-pkg-share lctk_launch)/config/targets/hollow_1000_aruco_4_v1.json5
    # velodyne_bbox.json5 selects detection_mode: bbox, so it needs the crop
    # box below -- every other hollow_1000 preset is bbox_free and omits it.
    detector_config: $(find-pkg-share lctk_launch)/config/board/hollow_1000/velodyne_bbox.json5
    bbox_config: $(find-pkg-share lctk_launch)/config/board/sample_data_bbox.json5
    pairs:
      - [top_lidar, front_center]
