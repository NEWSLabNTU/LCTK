# Two-LiDAR Calibration Configuration
#
# This configuration calibrates two LiDARs by detecting the same calibration
# board in both point clouds and computing the transform between them.
#
# Usage:
#   just two-lidar
#
# This generates:
# - 2 lidar_board_detector nodes (one per lidar)
# - 1 lidar-to-lidar solver node
# - 0 aruco locator nodes (no cameras)

devices:
  lidars:
    top_lidar:
      pointcloud_topic: /velodyne_points
      frame_id: velodyne
    front_lidar:
      pointcloud_topic: /iv_points
      frame_id: seyond
      # Per-LiDAR detector_config overrides the marker-level preset below,
      # which is how two differently-sampled LiDARs share one target: this
      # LiDAR gets the seyond-tuned preset while top_lidar takes the
      # marker-level velodyne preset.
      detector_config: $(find-pkg-share lctk_launch)/config/board/hollow_1000/seyond.json5

# Synchronizer window: how far apart in time a camera frame and a LiDAR
# sweep may be and still be treated as observing the calibration target at
# the same instant. Too wide and a moving board gets paired across frames
# where it has visibly moved; too narrow (or 0, meaning infinite) and
# streams at different rates drift apart with no time-based pairing at all.
# 100ms/100/reject_new matches the offline (rosbag/sample-data) default this
# config has always run under.
sync:
  tolerance_ms: 100
  queue_size: 100
  drop_policy: reject_new

markers:
  calibration_board:
    target_config: $(find-pkg-share lctk_launch)/config/targets/hollow_1000_aruco_4_v1.json5
    detector_config: $(find-pkg-share lctk_launch)/config/board/hollow_1000/velodyne.json5
    pairs:
      - [top_lidar, front_lidar]
