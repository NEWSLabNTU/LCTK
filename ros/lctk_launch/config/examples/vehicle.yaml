# Example Multi-Sensor Vehicle Calibration Configuration
#
# This configuration demonstrates a vehicle with:
# - 2 LiDARs (L1 front, L2 rear) on the roof
# - 4 cameras (C1-C4) on the four corners
# - 3 calibration markers (M1 front, M2 rear, M3 side)
#
# This generates:
# - 4 lidar_board_detector nodes: (L1,M1), (L1,M3), (L2,M2), (L2,M3)
# - 4 aruco_locator_node nodes: C1, C2, C3, C4
# - 4 lidar-camera solvers: L1-C1, L1-C2, L2-C3, L2-C4
# - 1 lidar-lidar solver: L1-L2
# - 1 tf_tree_broadcaster

devices:
  lidars:
    L1:
      pointcloud_topic: /sensing/lidar/front/points
      frame_id: lidar_front
    L2:
      pointcloud_topic: /sensing/lidar/rear/points
      frame_id: lidar_rear

  cameras:
    C1:
      image_topic: /sensing/camera/front_left/image
      frame_id: camera_front_left
    C2:
      image_topic: /sensing/camera/front_right/image
      frame_id: camera_front_right
    C3:
      image_topic: /sensing/camera/rear_left/image
      frame_id: camera_rear_left
    C4:
      image_topic: /sensing/camera/rear_right/image
      frame_id: camera_rear_right

# Root of the TF tree (defaults to first lidar)
reference_frame: L1

# Synchronizer window: how far apart in time a camera frame and a LiDAR
# sweep may be and still be treated as observing the calibration target at
# the same instant. Too wide and a moving board gets paired across frames
# where it has visibly moved; too narrow (or 0, meaning infinite) and
# streams at different rates drift apart with no time-based pairing at all.
# 100ms/100/reject_new matches the offline (rosbag/sample-data) default this
# config has always run under.
sync:
  tolerance_ms: 100
  queue_size: 100
  drop_policy: reject_new

markers:
  # Front marker — placed in front of the vehicle
  M1:
    type: hollow_board
    board_config: $(find-pkg-share lctk_launch)/config/board/board_detector.json5
    aruco_config: $(find-pkg-share lctk_launch)/config/aruco/aruco_pattern.json5
    bbox_config: $(find-pkg-share lctk_launch)/config/board/bbox.json5
    pairs:
      - [L1, C1]
      - [L1, C2]

  # Rear marker — placed behind the vehicle
  M2:
    type: hollow_board
    board_config: $(find-pkg-share lctk_launch)/config/board/board_detector.json5
    aruco_config: $(find-pkg-share lctk_launch)/config/aruco/aruco_pattern.json5
    bbox_config: $(find-pkg-share lctk_launch)/config/board/bbox.json5
    pairs:
      - [L2, C3]
      - [L2, C4]

  # Side marker — visible to both lidars
  M3:
    type: hollow_board
    board_config: $(find-pkg-share lctk_launch)/config/board/board_detector.json5
    aruco_config: $(find-pkg-share lctk_launch)/config/aruco/aruco_pattern.json5
    bbox_config: $(find-pkg-share lctk_launch)/config/board/bbox.json5
    pairs:
      - [L1, L2]
