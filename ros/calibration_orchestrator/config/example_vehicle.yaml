# Example Multi-Sensor Calibration Configuration
#
# This configuration describes a vehicle with:
# - 2 LiDARs (L1 front, L2 rear) on the roof
# - 4 cameras (C1-C4) on the four corners
# - 3 calibration markers (M1 front, M2 rear, M3 side)
#
# Calibration pairs:
# - L1 & C1 via M1 (front marker)
# - L1 & C2 via M1 (front marker)
# - L2 & C3 via M2 (rear marker)
# - L2 & C4 via M2 (rear marker)
# - L1 & L2 via M3 (side marker)
#
# This generates:
# - 4 lidar_board_detector nodes: (L1,M1), (L1,M3), (L2,M2), (L2,M3)
# - 4 aruco_locator_node nodes: C1, C2, C3, C4
# - 4 lidar-camera solvers: L1-C1, L1-C2, L2-C3, L2-C4
# - 1 lidar-lidar solver: L1-L2

devices:
  lidars:
    L1:
      pointcloud_topic: /sensing/lidar/front/points
      frame_id: lidar_front
    L2:
      pointcloud_topic: /sensing/lidar/rear/points
      frame_id: lidar_rear

  cameras:
    C1:
      image_topic: /sensing/camera/front_left/image
      frame_id: camera_front_left
    C2:
      image_topic: /sensing/camera/front_right/image
      frame_id: camera_front_right
    C3:
      image_topic: /sensing/camera/rear_left/image
      frame_id: camera_rear_left
    C4:
      image_topic: /sensing/camera/rear_right/image
      frame_id: camera_rear_right

markers:
  M1:
    type: hollow_board
    board_config: $(find-pkg-share lctk_launch)/config/board/board_detector.json5
    aruco_config: $(find-pkg-share lctk_launch)/config/board/aruco_pattern.json5
  M2:
    type: hollow_board
    board_config: $(find-pkg-share lctk_launch)/config/board/board_detector.json5
    aruco_config: $(find-pkg-share lctk_launch)/config/board/aruco_pattern.json5
  M3:
    type: hollow_board
    board_config: $(find-pkg-share lctk_launch)/config/board/board_detector.json5
    aruco_config: $(find-pkg-share lctk_launch)/config/board/aruco_pattern.json5

calibration_pairs:
  # Front calibrations using M1
  - devices: [L1, C1]
    marker: M1
  - devices: [L1, C2]
    marker: M1

  # Rear calibrations using M2
  - devices: [L2, C3]
    marker: M2
  - devices: [L2, C4]
    marker: M2

  # LiDAR-to-LiDAR calibration using M3 (side marker)
  - devices: [L1, L2]
    marker: M3
