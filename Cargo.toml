[workspace]
resolver = "2"
rust-version = "1.85.0"  # Minimum supported Rust version (MSRV)
members = [
    "src/ros2/*",
    "src/rust/*",
]
exclude = [
    # Launch-only package without Cargo.toml
    "src/ros2/lctk_launch",
    "src/ros2/lctk_sample_data",
    # Python package without Cargo.toml
    "src/ros2/extrinsic_solver_node",
    "src/ros2/filter_box_tuner",
    "src/ros2/calibration_evaluator",
    "src/ros2/calibration_judge",
    "src/ros2/pointcloud_image_overlay",
    # Interface package without Cargo.toml (CMake-based ROS package)
    "src/interface/lctk_interfaces",
]

[workspace.dependencies]
# Computer vision
opencv = { version = "0.88.9", default-features = false, features = ["clang-runtime"] }
cv-convert = { version = "0.26.0" }

# Core utilities
anyhow = "1.0.75"
arc-swap = "1.7.1"
eyre = "0.6"
thiserror = "1.0"
serde = { version = "1.0.188", features = ["derive"] }
clap = { version = "4.4.6", features = ["derive"] }
nalgebra = { version = "0.32.3", features = ["serde-serialize"] }

# Serialization/JSON handling
json5 = "0.4.1"
serde_json = "1.0.107"
serde-loader = { version = "0.2.0", features = ["json5"] }
serde_yaml = "0.9.25"

# Numeric/data processing
itertools = "0.11.0"
noisy_float = { version = "0.2.0", features = ["serde"] }
measurements = "0.11.0"
approx = "0.5.1"
pcd-rs = "0.10.0"

# Code generation/macros
strum = { version = "0.26.0", features = ["derive"] }
indexmap = "2.0.2"

# Date/time and utilities
once_cell = "1.18.0"
log = "0.4.20"
chrono = "0.4.31"
unzip-n = "0.1.2"

# Random
rand = "0.8.5"

# Visualization
rerun = { version = "0.23.4" }

# newslab-serde crates
newslab-serde-measurements = { git = "https://github.com/NEWSLabNTU/newslab-serde.git", tag = "v0.2.0" }
newslab-serde-nalgebra = { git = "https://github.com/NEWSLabNTU/newslab-serde.git", tag = "v0.2.0" }

# ROS2 dependencies from workspace
rclrs = { path = "src/ros2_rust_ws/install/rclrs/share/rclrs/rust" }
geometry_msgs = { path = "src/ros2_rust_ws/install/geometry_msgs/share/geometry_msgs/rust" }
sensor_msgs = { path = "src/ros2_rust_ws/install/sensor_msgs/share/sensor_msgs/rust" }
std_msgs = { path = "src/ros2_rust_ws/install/std_msgs/share/std_msgs/rust" }
vision_msgs = { path = "src/ros2_rust_ws/install/vision_msgs/share/vision_msgs/rust" }
visualization_msgs = { path = "src/ros2_rust_ws/install/visualization_msgs/share/visualization_msgs/rust" }
builtin_interfaces = { path = "src/ros2_rust_ws/install/builtin_interfaces/share/builtin_interfaces/rust" }
tf2_msgs = { path = "src/ros2_rust_ws/install/tf2_msgs/share/tf2_msgs/rust" }
lctk_interfaces = { path = "install/lctk_interfaces/share/lctk_interfaces/rust" }

[profile.test-release]
inherits = "release"
debug = true
