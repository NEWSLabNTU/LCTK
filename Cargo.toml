[workspace]
resolver = "2"
rust-version = "1.85.0"  # Minimum supported Rust version (MSRV)
members = [
    "rust/*",
    "ros/aruco_generator_node",
    "ros/aruco_locator_node",
    "ros/lidar_board_detector",
]
exclude = [
    # Launch-only package without Cargo.toml
    "ros/lctk_launch",
    "ros/lctk_sample_data",
    # Python package without Cargo.toml
    "ros/extrinsic_solver_node",
    "ros/advanced_extrinsic_solver",
    "ros/interactive_solver_controller",
    "ros/filter_box_tuner",
    "ros/calibration_evaluator",
    "ros/calibration_judge",
    "ros/pointcloud_image_overlay",
    "ros/lidar_to_lidar_solver",
    "ros/calibration_orchestrator",
    # Interface package without Cargo.toml (CMake-based ROS package)
    "ros/lctk_interfaces",
    # Conflux has its own workspace
    "ros/conflux",
]

[workspace.dependencies]
# Computer vision
opencv = { version = "0.88.9", default-features = false, features = ["clang-runtime"] }
cv-convert = { version = "0.26.0" }

# Core utilities
anyhow = "1.0.75"
arc-swap = "1.7.1"
eyre = "0.6"
thiserror = "1.0"
serde = { version = "1.0.188", features = ["derive"] }
clap = { version = "4.4.6", features = ["derive"] }
nalgebra = { version = "0.32.3", features = ["serde-serialize"] }

# Serialization/JSON handling
json5 = "0.4.1"
serde_json = "1.0.107"
serde-loader = { version = "0.2.0", features = ["json5"] }
serde_yaml = "0.9.25"

# Numeric/data processing
itertools = "0.11.0"
noisy_float = { version = "0.2.0", features = ["serde"] }
measurements = "0.11.0"
approx = "0.5.1"
pcd-rs = "0.10.0"

# Code generation/macros
strum = { version = "0.26.0", features = ["derive"] }
indexmap = "2.0.2"

# Date/time and utilities
once_cell = "1.18.0"
log = "0.4.20"
chrono = "0.4.31"
unzip-n = "0.1.2"

# Random
rand = "0.8.5"

# Visualization
rerun = { version = "0.23.4" }

# newslab-serde crates
newslab-serde-measurements = { git = "https://github.com/NEWSLabNTU/newslab-serde.git", tag = "v0.2.0" }
newslab-serde-nalgebra = { git = "https://github.com/NEWSLabNTU/newslab-serde.git", tag = "v0.2.0" }

# ROS2 dependencies - cargo-ros2 will resolve these via ament_index
# NOTE: lctk_interfaces is NOT in workspace.dependencies because it's a local
# interface package that must be built first. Packages that need it should
# declare it directly in their Cargo.toml with lctk_interfaces = "*"
rclrs = "0.7"
geometry_msgs = "*"
sensor_msgs = "*"
std_msgs = "*"
vision_msgs = "*"
visualization_msgs = "*"
builtin_interfaces = "*"
tf2_msgs = "*"

[profile.test-release]
inherits = "release"
debug = true
