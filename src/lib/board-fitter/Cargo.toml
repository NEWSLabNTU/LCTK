[package]
name = "board-fitter"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
nalgebra = "0.33"
measurements = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"
log = "0.4"

# Local dependencies
board-fitter-config = { path = "../board-fitter-config" }

# Point cloud processing
rand = "0.8"
rand_chacha = "0.3"

# Collections and utilities
indexmap = "2.0"
uuid = { version = "1.0", features = ["v4"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
env_logger = "0.11"
approx = "0.5"

[features]
default = []
# Future features for optimization
cuda = []
opencl = []
