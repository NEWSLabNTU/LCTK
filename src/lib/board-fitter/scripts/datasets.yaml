# External Test Datasets Configuration
# Format: YAML with dataset definitions including URLs, checksums, and metadata

datasets:
  # PCL (Point Cloud Library) datasets
  pcl_table_scene:
    name: "PCL Table Scene with LMS400"
    url: "https://raw.githubusercontent.com/PointCloudLibrary/data/master/tutorials/table_scene_lms400.pcd"
    output_path: "pcl/table_scene_lms400.pcd"
    size: 5649007  # bytes (updated from actual download)
    sha256: "e285d415641e0d9de695b611db874cc8fe995e8089b77a50d6056d24d8cbcc58"
    description: "Table scene with planar surfaces, good for plane detection testing"
    license: "BSD"
    source: "https://github.com/PointCloudLibrary/data"
    tags: ["pcl", "planar", "table", "medium"]

  pcl_mug_scene:
    name: "PCL Mug Scene (Stereo Textured)"
    url: "https://raw.githubusercontent.com/PointCloudLibrary/data/master/tutorials/table_scene_mug_stereo_textured.pcd"
    output_path: "pcl/table_scene_mug_stereo_textured.pcd"
    size: 1726044  # bytes (updated from actual download)
    sha256: "1a79fe07ce50023699f2b7a1bae37f18174b2495619bf7839d962ac282249334"
    description: "Organized point cloud with color information"
    license: "BSD"
    source: "https://github.com/PointCloudLibrary/data"
    tags: ["pcl", "color", "organized", "large"]

  # Additional PCL datasets
  pcl_ism_cat:
    name: "PCL ISM Test Cat"
    url: "https://raw.githubusercontent.com/PointCloudLibrary/data/master/tutorials/ism_test_cat.pcd"
    output_path: "pcl/ism_test_cat.pcd"
    size: 126533  # bytes (actual size)
    sha256: "8f167fa10e7ac9266c74f992a67daabb159514688b6e5eabbf91e10eaec81e50"
    description: "Test cat point cloud for object recognition"
    license: "BSD"
    source: "https://github.com/PointCloudLibrary/data"
    tags: ["pcl", "object", "cat", "medium"]

# Synthetic data generation recipes
synthetic_datasets:
  perfect_board:
    name: "Perfect Diamond Board"
    output_path: "synthetic/perfect_board.xyz"
    script: "generate_perfect_board"
    parameters:
      board_size: 1.0
      distance: 2.0
      points_per_side: 30
      holes: 
        - {x: 0.0, y: 0.35, radius: 0.1}
        - {x: -0.35, y: 0.0, radius: 0.05}
        - {x: 0.35, y: 0.0, radius: 0.05}
    description: "Perfect 1m diamond board at 2m distance"
    tags: ["synthetic", "perfect", "diamond", "small"]

  noisy_board:
    name: "Noisy Diamond Board"
    output_path: "synthetic/noisy_board.xyz"
    script: "generate_noisy_board"
    parameters:
      board_size: 1.0
      distance: 2.0
      points_per_side: 30
      noise_level: 0.02  # 2cm
      holes:
        - {x: 0.0, y: 0.35, radius: 0.1}
        - {x: -0.35, y: 0.0, radius: 0.05}
        - {x: 0.35, y: 0.0, radius: 0.05}
    description: "Diamond board with 2cm Gaussian noise"
    tags: ["synthetic", "noisy", "diamond", "small"]

  occluded_board:
    name: "Occluded Diamond Board"
    output_path: "synthetic/occluded_board.xyz"
    script: "generate_occluded_board"
    parameters:
      board_size: 1.0
      distance: 2.0
      points_per_side: 30
      occlusion_ratio: 0.3  # 30%
      holes:
        - {x: 0.0, y: 0.35, radius: 0.1}
        - {x: -0.35, y: 0.0, radius: 0.05}
        - {x: 0.35, y: 0.0, radius: 0.05}
    description: "Diamond board with 30% random occlusion"
    tags: ["synthetic", "occluded", "diamond", "small"]

# ROS calibration simulation
ros_calibration:
  name: "ROS Calibration Board Sample"
  output_path: "ros/calibration_board_sample.pcd"
  script: "generate_ros_calibration"
  parameters:
    board_size: 1.0
    distance: 2.0
    points_per_side: 20
    format: "pcd"
    frame_id: "lidar_frame"
  description: "Synthetic calibration board in ROS PCD format"
  tags: ["ros", "calibration", "pcd", "synthetic"]

# Download configuration
download_config:
  base_dir: "test_data/external"
  max_retries: 3
  timeout_seconds: 30
  verify_checksums: true
  create_manifest: true
  parallel_downloads: 2

# Checksum verification
checksum_config:
  algorithm: "sha256"
  verify_after_download: true
  save_checksums_file: "checksums.txt"