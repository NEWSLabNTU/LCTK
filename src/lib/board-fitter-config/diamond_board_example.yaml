# Example board configuration for a 1m square board in diamond pose
# with three circular holes: top (10cm radius), left and right (5cm radius each)

board:
  # 1 meter square board
  size: "1.0 m"
  
  # Three circular holes positioned for diamond orientation
  holes:
    # Top corner hole (largest)
    - radius: "0.1 m"  # 10 cm radius
      position:
        x: "0.0 m"
        y: "0.5 m"
      id: "top_hole"
    
    # Left corner hole
    - radius: "0.05 m"  # 5 cm radius
      position:
        x: "-0.5 m"
        y: "0.0 m"
      id: "left_hole"
    
    # Right corner hole
    - radius: "0.05 m"  # 5 cm radius
      position:
        x: "0.5 m"
        y: "0.0 m"
      id: "right_hole"
  
  # Optional board thickness
  thickness: "0.02 m"  # 2 cm thick

# Detection algorithm configuration
detection:
  method: "ransac_square_fitting"
  parameters:
    max_iterations: 1000
    inlier_threshold: 0.01
    min_inliers: 100
    confidence: 0.99

# Optional metadata
metadata:
  name: "Diamond Board 1m with 3 holes"
  description: "1 meter square calibration board in diamond orientation with asymmetric hole pattern"
  created_date: "2025-01-13"
  hole_pattern: "asymmetric_3_holes"
  orientation: "diamond"
