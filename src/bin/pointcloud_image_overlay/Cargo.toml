[package]
name = "pointcloud_image_overlay"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
builtin_interfaces = "*"
geometry_msgs = "*"
nalgebra = { workspace = true }
palette = "0.7.3"
rclrs = "*"
rerun = { version = "0.18", features = ["web_viewer"] }
sensor_msgs = "*"
std_msgs = "*"
unzip-n.workspace = true
