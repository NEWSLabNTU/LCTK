# Board configuration for multi-wayside calibration
# 1m x 1m square board with 4 circular holes

board:
  # Board dimensions (in meters)
  width: 1.0      # 1000mm
  height: 1.0     # 1000mm  
  thickness: 0.02 # 20mm

  # Hole configuration - 4 holes in square arrangement
  holes:
    - center: [-0.2, -0.2, 0.0]  # meters (was -200mm)
      radius: 0.15               # meters (was 150mm)
      id: "hole_1"
    - center: [0.2, -0.2, 0.0]
      radius: 0.15
      id: "hole_2"  
    - center: [0.2, 0.2, 0.0]
      radius: 0.15
      id: "hole_3"
    - center: [-0.2, 0.2, 0.0]
      radius: 0.15
      id: "hole_4"

  # ArUco marker positions (if any)
  aruco_markers: []