launch:
  # Launch Arguments

  - arg:
      name: aruco_config_file
      default: ""
      description: "Path to ArUco pattern configuration JSON5 file"

  - arg:
      name: board_config_file
      default: ""
      description: "Path to calibration board configuration JSON5 file"

  - arg:
      name: camera_topic
      default: "/camera/image_raw"
      description: "Input camera image topic"

  - arg:
      name: camera_info_topic
      default: "/camera/camera_info"
      description: "Input camera info topic"

  - arg:
      name: pointcloud_topic
      default: "/lidar/pointcloud"
      description: "Input point cloud topic"

  - arg:
      name: debug_mode
      default: "false"
      description: "Enable debug logging and visualization"

  - arg:
      name: sync_window_ms
      default: "50"
      description: "Synchronization window size in milliseconds"

  - arg:
      name: max_distance
      default: "10.0"
      description: "Maximum distance for point cloud filtering (meters)"

  - arg:
      name: min_distance
      default: "1.0"
      description: "Minimum distance for point cloud filtering (meters)"

  # ArUco Locator Node
  - node:
      pkg: aruco_locator_node
      exec: aruco_locator_node
      name: aruco_locator
      namespace: calibration
      output: screen
      param:
        - name: aruco_config_file
          value: "$(var aruco_config_file)"
        - name: debug_mode
          value: "$(var debug_mode)"
      remap:
        - from: input_image
          to: "$(var camera_topic)"
        - from: camera_info
          to: "$(var camera_info_topic)"

  # Calibration Board Locator Node
  - node:
      pkg: calibration_board_locator
      exec: calibration_board_locator
      name: calibration_board_locator
      namespace: calibration
      output: screen
      param:
        - name: board_config_file
          value: "$(var board_config_file)"
        - name: debug_mode
          value: "$(var debug_mode)"
      remap:
        - from: input_pointcloud
          to: "$(var pointcloud_topic)"

  # Synchronizer Node
  - node:
      pkg: synchronizer
      exec: synchronizer
      name: synchronizer
      namespace: calibration
      output: screen
      param:
        - name: window_size_ms
          value: "$(var sync_window_ms)"
        - name: buffer_size
          value: "100"
        - name: quality_threshold
          value: "128"
        - name: enable_debug
          value: "$(var debug_mode)"
      remap:
        - from: aruco_detections
          to: /calibration/aruco_locator/aruco_detections
        - from: board_detections
          to: /calibration/calibration_board_locator/board_detections

  # Extrinsic Solver Node
  - node:
      pkg: extrinsic_solver
      exec: extrinsic_solver
      name: extrinsic_solver
      namespace: calibration
      output: screen
      param:
        - name: solver_method
          value: "SQPNP"
        - name: min_detections_required
          value: "5"
        - name: max_solver_iterations
          value: "1000"
        - name: convergence_threshold
          value: "1e-6"
        - name: debug_mode
          value: "$(var debug_mode)"
      remap:
        - from: synchronized_detections
          to: /calibration/synchronizer/synchronized_detections
        - from: camera_info
          to: "$(var camera_info_topic)"

  # Pointcloud Image Overlay Node (with Rerun visualization)
  - node:
      pkg: pointcloud_image_overlay
      exec: pointcloud_image_overlay
      name: pointcloud_image_overlay
      namespace: calibration
      output: screen
      param:
        - name: max_distance
          value: "$(var max_distance)"
        - name: min_distance
          value: "$(var min_distance)"
        - name: camera_depth_thresh
          value: "0.0"
        - name: keep_back_points
          value: "false"
        - name: message_timeout_seconds
          value: "5"
      remap:
        - from: input_pointcloud
          to: /calibration/synchronizer/synchronized_pointcloud
        - from: input_image
          to: /calibration/synchronizer/synchronized_image
        - from: camera_info
          to: "$(var camera_info_topic)"
        - from: extrinsic_transform
          to: /calibration/extrinsic_solver/extrinsic_transform
