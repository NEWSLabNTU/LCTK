launch:
  # Launch Arguments

  - arg:
      name: lidar1_pointcloud_topic
      default: "/lidar1/pointcloud"
      description: "Input point cloud topic for the first LiDAR"

  - arg:
      name: lidar2_pointcloud_topic
      default: "/lidar2/pointcloud"
      description: "Input point cloud topic for the second LiDAR"

  - arg:
      name: board_config_file
      default: ""
      description: "Path to calibration board configuration JSON5 file"

  - arg:
      name: debug_mode
      default: "false"
      description: "Enable debug logging"

  # Calibration Board Locator Node for LiDAR 1
  - node:
      pkg: calibration_board_locator
      exec: calibration_board_locator
      name: calibration_board_locator_1
      namespace: calibration
      output: screen
      param:
        - name: board_config_file
          value: "$(var board_config_file)"
        - name: debug_mode
          value: "$(var debug_mode)"
      remap:
        - from: input_pointcloud
          to: "$(var lidar1_pointcloud_topic)"
        - from: board_detections
          to: /lidar1/board_detections

  # Calibration Board Locator Node for LiDAR 2
  - node:
      pkg: calibration_board_locator
      exec: calibration_board_locator
      name: calibration_board_locator_2
      namespace: calibration
      output: screen
      param:
        - name: board_config_file
          value: "$(var board_config_file)"
        - name: debug_mode
          value: "$(var debug_mode)"
      remap:
        - from: input_pointcloud
          to: "$(var lidar2_pointcloud_topic)"
        - from: board_detections
          to: /lidar2/board_detections

  # Multi-Wayside Node
  - node:
      pkg: multi_wayside_node
      exec: multi_wayside_node
      name: multi_wayside_node
      namespace: calibration
      output: screen
      param:
        - name: debug_mode
          value: "$(var debug_mode)"
      remap:
        - from: lidar1_board_detections
          to: /lidar1/board_detections
        - from: lidar2_board_detections
          to: /lidar2/board_detections
        - from: lidar1_to_lidar2_transform
          to: /lidar1_to_lidar2_transform
