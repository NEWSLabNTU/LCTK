[package]
name = "aruco-config"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
measurements = { workspace = true }
noisy_float = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
strum = { workspace = true }
newslab-serde-measurements = { workspace = true }
calibration-target = { version = "0.1.0", path = "../calibration-target" }

[dependencies.opencv]
workspace = true
optional = true
default-features = false
features = ["aruco", "calib3d"]

[features]
with-opencv = ["opencv"]

[[example]]
name = "multi_aruco"
required-features = ["with-opencv"]
