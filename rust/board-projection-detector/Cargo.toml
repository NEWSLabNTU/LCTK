# Standalone cargo workspace: this crate is ROS-free, but the root LCTK
# workspace pulls ROS message crates (aruco-detector -> sensor_msgs = "*",
# yanked on crates.io) that only resolve under colcon. Excluding this crate
# from the root workspace and rooting its own here lets plain `cargo test`
# resolve it. Deps are all pure-Rust — notably NOT hollow-board-detector,
# which drags in sfcgal-sys (native SFCGAL C lib); voxel_downsample is
# implemented locally and RANSAC is a hand-rolled plain seeded 300-iteration
# fit (`candidates::ransac_plane_inliers`) matching open3d segment_plane.
[workspace]

[package]
name = "board-projection-detector"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
nalgebra = { version = "0.32.3", features = ["serde-serialize"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
json5 = "0.4.1"
log = "0.4.20"
rand = "0.8"

[dev-dependencies]
approx = "0.5.1"
serde_json = "1.0"
