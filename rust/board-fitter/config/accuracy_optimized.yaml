# Accuracy-optimized ICP configuration for high-precision board detection
# Target: <20mm position error with detailed refinement

enable_cuda: true
cuda_device_id: 0
fallback_to_cpu: true
num_threads: 8

# Square pose refinement - high precision
square_pose_refinement:
  enabled: true
  registration_type:
    Gicp  # Full GICP with covariance
  max_iterations: 50
  downsampling_resolution: 0.005  # 5mm downsampling for precision
  num_neighbors: 30
  convergence_criteria:
    translation_epsilon: 0.0005  # 0.5mm tolerance
    rotation_epsilon: 0.001      # ~0.06 degree tolerance
    max_correspondence_distance: 0.05
  robust_kernel:
    Cauchy:
      threshold: 0.02       # 2cm outlier threshold
  use_covariance_estimation: true

# Hole pattern alignment - full precision
hole_pattern_alignment:
  enabled: true
  registration_type:
    Gicp
  max_iterations: 30
  downsampling_resolution: 0.002  # 2mm for hole precision
  num_neighbors: 20
  convergence_criteria:
    translation_epsilon: 0.0002
    rotation_epsilon: 0.0005
    max_correspondence_distance: 0.02
  robust_kernel:
    Huber:
      threshold: 0.01
  use_covariance_estimation: true

# Board pose refinement - final high precision
board_pose_refinement:
  enabled: true
  registration_type:
    Vgicp:
      voxel_resolution: 0.002  # 2mm voxels for final precision
  max_iterations: 100
  downsampling_resolution: 0.001  # 1mm final downsampling
  num_neighbors: 50
  convergence_criteria:
    translation_epsilon: 0.0001  # 0.1mm final accuracy
    rotation_epsilon: 0.0002     # ~0.01 degree final accuracy
    max_correspondence_distance: 0.01
  robust_kernel:
    Cauchy:
      threshold: 0.005
  use_covariance_estimation: true

# Temporal alignment - multi-frame consistency
temporal_alignment:
  enabled: true
  registration_type:
    Gicp
  max_iterations: 20
  downsampling_resolution: 0.01
  num_neighbors: 15
  convergence_criteria:
    translation_epsilon: 0.001
    rotation_epsilon: 0.002
    max_correspondence_distance: 0.02
  use_covariance_estimation: true