[package]
name = "aruco-detector"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cv-convert = { workspace = true, features = ["nalgebra", "opencv"] }
measurements = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
noisy_float = { workspace = true }
aruco-config = { version = "0.1.0", path = "../aruco-config", features = ["with-opencv"] }
itertools = { workspace = true }
sensor_msgs.workspace = true
calibration-target = { version = "0.1.0", path = "../calibration-target" }

[dependencies.opencv]
workspace = true
default-features = false
features = ["aruco", "calib3d"]

[dependencies.nalgebra]
workspace = true

[dependencies.newslab-geom-algo]
git = "https://github.com/NEWSLabNTU/newslab-geom-algo.git"
tag = "v0.2.1"

[dev-dependencies.opencv]
workspace = true
default-features = false
# imgproc: `remap`, used by the contract tests to synthesize a distorted camera image.
features = ["aruco", "calib3d", "imgcodecs", "imgproc"]

[dev-dependencies]
clap = { workspace = true }
sensor_msgs.workspace = true
std_msgs.workspace = true
aruco-config = { version = "0.1.0", path = "../aruco-config", features = ["with-opencv"] }
measurements = { workspace = true }
noisy_float = { workspace = true }
anyhow = { workspace = true }
