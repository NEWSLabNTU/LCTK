[project]
name = "boarddet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aeon", email = "jerry73204@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "open3d>=0.19.0",
    "opencv-python-headless>=5.0.0.93",
    "velodyne-decoder>=3.1.0",
]

[tool.pytest.ini_options]
# The LCTK dev shell sources ROS, whose PYTHONPATH leaks python3.10 pytest
# plugins (launch_testing) into this ROS-free venv. Load no external plugins.
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
