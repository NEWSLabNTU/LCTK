[project]
name = "boarddet"
version = "0.1.0"
description = "Phase 7 experiment: crop-box-free LiDAR board detection via plane-fit + 2D projection scoring"
readme = "README.md"
authors = [
    { name = "aeon", email = "jerry73204@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dpkt>=1.9.8",
    "json5>=0.15.0",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "open3d>=0.18.0",
    "opencv-python-headless>=5.0.0.93",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "velodyne-decoder>=3.1.0",
]

[tool.uv]
# This experiment must also run on the project's Jetson (aarch64), not only
# on the x86 box the stage 1-8 benchmarks were produced on. Declaring the
# aarch64 environment as required forces the universal resolution to pick
# dependency versions that actually ship aarch64 wheels -- notably open3d,
# whose 0.19.0 release is x86_64/macOS/Windows only.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
# The LCTK dev shell sources ROS, whose PYTHONPATH leaks python3.10 pytest
# plugins (launch_testing) into this ROS-free venv. Load no external plugins.
addopts = "--disable-plugin-autoload"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
